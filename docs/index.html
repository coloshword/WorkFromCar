<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Work From Car</title>
  <style>
    :root {
      --bg: #0f271f;
      --heading: #e8fff6;
      --text: rgba(232, 255, 246, 0.76);
      --muted: rgba(232, 255, 246, 0.45);
      --link: #a7f3d0;
      --accent: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    main {
      width: 100%;
      max-width: 640px;
    }
    .pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.35);
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .icon {
      display: block;
      width: 84px;
      height: 84px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0 0 12px;
      color: var(--heading);
      font-size: clamp(2rem, 8vw, 4rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }
    p {
      margin: 0 0 20px;
      font-size: 1.05rem;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 28px;
    }
    a {
      color: var(--link);
      text-decoration: none;
      font-weight: 600;
    }
    a:hover { text-decoration: underline; }
    .muted {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 28px;
    }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="app-icon.svg" alt="Work From Car app icon" />
    <span class="pill">Work From Car</span>
    <h1>Voice-first email and calendar assistance.</h1>
    <p>
      Work From Car helps you manage Gmail, Google Calendar, and contacts through natural voice interaction,
      with on-device speech processing and AI-assisted planning.
    </p>
    <nav aria-label="Legal links">
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Service</a>
    </nav>
    <p class="muted">Contact: <a href="mailto:work-from-car@googlegroups.com">work-from-car@googlegroups.com</a></p>
  </main>
</body>
</html>
