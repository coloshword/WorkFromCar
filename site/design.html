<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>WFC — OLED Black Redesign</title>
  <style>
    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; overflow:hidden; }
    body{
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #181818;
      color: #E5E7EB;
      -webkit-font-smoothing: antialiased;
    }

    .phone{
      max-width: 430px;
      height: 100svh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* ─── Topbar ─── */
    .topbar{
      height: 96px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 20px 14px;
      position: relative;
      z-index: 10;
    }
    .topbar::after{
      content: '';
      position: absolute;
      bottom: 0; left: 20px; right: 20px;
      height: 1px;
      background: rgba(255,255,255,0.06);
    }
    .topbar-btn{
      width: 36px; height: 36px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .topbar-btn:hover{ border-color: rgba(255,255,255,0.18); }
    .topbar-btn svg{ opacity: 0.7; }
    .topbar-right{ display:flex; gap:10px; align-items:center; }
    .ready-dot{
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    /* ─── Center area ─── */
    .center{
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-bottom: 40px;
    }

    /* ─── Waveform ─── */
    canvas#waveform{
      width: 260px;
      height: 80px;
      display: block;
    }

    .state-label{
      margin-top: 16px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0.7;
      transition: color 0.5s, opacity 0.5s;
    }

    /* ─── Tool Card ─── */
    .tool-card{
      width: calc(100% - 40px);
      max-width: 390px;
      margin: 28px auto 0;
      border-radius: 16px;
      border: 1px solid var(--accent-border);
      background: rgba(255,255,255,0.02);
      padding: 16px;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.4s ease, transform 0.4s ease, border-color 0.5s;
    }
    .tool-card.visible{
      opacity: 1;
      transform: translateY(0);
    }
    .tool-header{
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .tool-icon{
      width: 28px; height: 28px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.08);
      display: grid;
      place-items: center;
    }
    .tool-icon svg{ width:14px; height:14px; }
    .tool-name{
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
      flex: 1;
    }
    .tool-badge{
      font-size: 10px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.5px;
    }
    .tool-rows{ display:flex; flex-direction:column; gap:8px; }
    .tool-row{
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 10px;
      align-items: baseline;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(255,255,255,0.04);
    }
    .tool-key{
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .tool-val{
      font-size: 12px;
      color: #E5E7EB;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tool-val.null{
      color: rgba(255,255,255,0.2);
      font-style: italic;
    }

    /* ─── Dev input ─── */
    .dev-input{
      display: flex;
      gap: 8px;
      padding: 12px 20px 32px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .dev-input input{
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 10px 14px;
      color: #E5E7EB;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .dev-input input::placeholder{ color: rgba(255,255,255,0.2); }
    .dev-input input:focus{ border-color: rgba(255,255,255,0.18); }
    .dev-input button{
      padding: 10px 18px;
      border-radius: 12px;
      border: 1px solid var(--accent-border);
      background: var(--accent-bg);
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .dev-input button:hover{ opacity: 0.8; }

    /* ─── State indicator strip ─── */
    .state-strip{
      position: absolute;
      bottom: 96px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 20;
    }
    .state-btn{
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.03);
      color: rgba(255,255,255,0.5);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: all 0.3s;
    }
    .state-btn.active{
      color: var(--accent);
      border-color: var(--accent-border);
      background: var(--accent-bg);
    }

    /* ─── CSS Vars by state ─── */
    :root{
      --accent: #83d2ce;
      --accent-glow: rgba(131,210,206,0.4);
      --accent-border: rgba(131,210,206,0.15);
      --accent-bg: rgba(131,210,206,0.08);
    }
  </style>
</head>
<body>
  <div class="phone" id="phone">
    <div class="topbar">
      <div class="topbar-btn" aria-label="Logout">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.8" stroke-linecap="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </div>
      <div class="topbar-right">
        <div class="ready-dot"></div>
        <div class="topbar-btn" aria-label="Help">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="center">
      <canvas id="waveform" width="520" height="160"></canvas>
      <div class="state-label" id="stateLabel">Listening</div>

      <div class="tool-card" id="toolCard">
        <div class="tool-header">
          <div class="tool-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="color:var(--accent)">
              <rect x="2" y="4" width="20" height="16" rx="3"/>
              <polyline points="2 4 12 13 22 4"/>
            </svg>
          </div>
          <div class="tool-name" id="toolName">gmail.createDraft</div>
          <div class="tool-badge" id="toolBadge">Selected</div>
        </div>
        <div class="tool-rows" id="toolRows"></div>
      </div>
    </div>

    <div class="state-strip" id="stateStrip">
      <div class="state-btn active" data-state="listening">Listening</div>
      <div class="state-btn" data-state="processing">Processing</div>
      <div class="state-btn" data-state="speaking">Speaking</div>
    </div>

    <div class="dev-input">
      <input type="text" placeholder="Type a message..." />
      <button>Send</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('waveform');
    const ctx = canvas.getContext('2d');
    const stateLabel = document.getElementById('stateLabel');
    const toolCard = document.getElementById('toolCard');
    const toolName = document.getElementById('toolName');
    const toolBadge = document.getElementById('toolBadge');
    const toolRows = document.getElementById('toolRows');
    const phone = document.getElementById('phone');
    const stateStrip = document.getElementById('stateStrip');

    const COLORS = {
      listening:  { accent: '#83d2ce', glow: 'rgba(131,210,206,0.4)',  border: 'rgba(131,210,206,0.15)', bg: 'rgba(131,210,206,0.08)' },
      processing: { accent: '#ecc98d', glow: 'rgba(236,201,141,0.4)',  border: 'rgba(236,201,141,0.15)', bg: 'rgba(236,201,141,0.08)' },
      speaking:   { accent: '#e194da', glow: 'rgba(225,148,218,0.4)',  border: 'rgba(225,148,218,0.15)', bg: 'rgba(225,148,218,0.08)' },
    };

    const TOOL_STATES = {
      listening:  { params: null },
      processing: { params: { to: null, subject: null, body: null } },
      speaking:   { params: { to: 'acero.liangli@gmail.com', subject: 'Quick question', body: 'Hey — can we chat today?' } },
    };

    const BAR_COUNT = 36;
    const BAR_WIDTH = 3;
    const BAR_GAP = 2;
    const MIN_H = 3;

    let currentState = 'listening';
    let t = 0;
    let targetHeights = new Float32Array(BAR_COUNT).fill(MIN_H);
    let currentHeights = new Float32Array(BAR_COUNT).fill(MIN_H);

    function setCSSVars(state) {
      const c = COLORS[state];
      const root = document.documentElement;
      root.style.setProperty('--accent', c.accent);
      root.style.setProperty('--accent-glow', c.glow);
      root.style.setProperty('--accent-border', c.border);
      root.style.setProperty('--accent-bg', c.bg);
    }

    function setToolCard(state) {
      const ts = TOOL_STATES[state];
      if (!ts.params) {
        toolCard.classList.remove('visible');
        return;
      }
      toolCard.classList.add('visible');
      toolName.textContent = 'gmail.createDraft';
      toolBadge.textContent = state === 'processing' ? 'Planning...' : 'Ready';
      toolRows.innerHTML = '';
      for (const [k, v] of Object.entries(ts.params)) {
        const row = document.createElement('div');
        row.className = 'tool-row';
        row.innerHTML = `
          <div class="tool-key">${k}</div>
          <div class="tool-val ${v === null ? 'null' : ''}">${v === null ? 'null' : v}</div>
        `;
        toolRows.appendChild(row);
      }
    }

    function setState(state) {
      currentState = state;
      setCSSVars(state);
      stateLabel.textContent =
        state === 'listening' ? 'Listening' :
        state === 'processing' ? 'Processing' : 'Speaking';
      setToolCard(state);

      stateStrip.querySelectorAll('.state-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.state === state);
      });
    }

    stateStrip.addEventListener('click', e => {
      const btn = e.target.closest('.state-btn');
      if (btn) setState(btn.dataset.state);
    });

    function computeTargets() {
      const center = BAR_COUNT / 2;
      for (let i = 0; i < BAR_COUNT; i++) {
        const distFromCenter = Math.abs(i - center) / center;

        if (currentState === 'listening') {
          const wave1 = Math.sin(t * 1.8 + i * 0.35) * 0.5 + 0.5;
          const wave2 = Math.sin(t * 1.2 + i * 0.55 + 1.5) * 0.5 + 0.5;
          const envelope = 1 - distFromCenter * 0.6;
          const h = MIN_H + (wave1 * 0.4 + wave2 * 0.6) * 28 * envelope;
          targetHeights[i] = h;

        } else if (currentState === 'processing') {
          const pulse = Math.sin(t * 2.5) * 0.5 + 0.5;
          const h = MIN_H + pulse * 6 * (1 - distFromCenter * 0.4);
          targetHeights[i] = h;

        } else if (currentState === 'speaking') {
          const wave1 = Math.sin(t * 2.2 + i * 0.3) * 0.5 + 0.5;
          const wave2 = Math.sin(t * 3.1 + i * 0.5 + 2) * 0.5 + 0.5;
          const wave3 = Math.sin(t * 1.5 + i * 0.15 + 4) * 0.5 + 0.5;
          const envelope = 1 - distFromCenter * 0.35;
          const h = MIN_H + (wave1 * 0.35 + wave2 * 0.35 + wave3 * 0.3) * 50 * envelope;
          targetHeights[i] = h;
        }
      }
    }

    function draw() {
      const dpr = window.devicePixelRatio || 1;
      const cw = canvas.width;
      const ch = canvas.height;
      ctx.clearRect(0, 0, cw, ch);

      const totalWidth = BAR_COUNT * BAR_WIDTH + (BAR_COUNT - 1) * BAR_GAP;
      const startX = (cw - totalWidth * dpr) / 2;
      const midY = ch / 2;

      const c = COLORS[currentState];

      for (let i = 0; i < BAR_COUNT; i++) {
        const smoothing = currentState === 'processing' ? 0.06 : 0.12;
        currentHeights[i] += (targetHeights[i] - currentHeights[i]) * smoothing;
        const h = currentHeights[i] * dpr;
        const w = BAR_WIDTH * dpr;
        const x = startX + i * (BAR_WIDTH + BAR_GAP) * dpr;
        const y = midY - h / 2;

        const distFromCenter = Math.abs(i - BAR_COUNT / 2) / (BAR_COUNT / 2);
        const alpha = 0.4 + (1 - distFromCenter) * 0.6;

        ctx.beginPath();
        ctx.roundRect(x, y, w, h, w / 2);
        ctx.fillStyle = c.accent;
        ctx.globalAlpha = alpha;
        ctx.fill();

        if (currentHeights[i] > 12) {
          ctx.shadowColor = c.glow;
          ctx.shadowBlur = 8 * dpr;
          ctx.beginPath();
          ctx.roundRect(x, y, w, h, w / 2);
          ctx.globalAlpha = alpha * 0.3;
          ctx.fill();
          ctx.shadowBlur = 0;
        }

        ctx.globalAlpha = 1;
      }
    }

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
    }

    function loop() {
      t += 0.025;
      computeTargets();
      draw();
      requestAnimationFrame(loop);
    }

    // Auto-cycle states
    let autoCycleTimer = null;
    function startAutoCycle() {
      const order = ['listening', 'processing', 'speaking'];
      let idx = 0;
      autoCycleTimer = setInterval(() => {
        idx = (idx + 1) % order.length;
        setState(order[idx]);
      }, 4000);
    }

    stateStrip.addEventListener('click', () => {
      if (autoCycleTimer) { clearInterval(autoCycleTimer); autoCycleTimer = null; }
    });

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    setState('listening');
    startAutoCycle();
    loop();
  </script>
</body>
</html>
